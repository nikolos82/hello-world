let section=0,sheet=-1,limit=50;
const q=document.getElementById('q'),results=document.getElementById('results'),tabs=document.getElementById('tabs'),subtabs=document.getElementById('subtabs'),count=document.getElementById('count'),hint=document.getElementById('hint'),more=document.getElementById('more');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLocaleLowerCase('ru');
function highlight(s,words){let raw=String(s??''),lower=norm(raw),spans=[];for(const word of words){let from=0,at;while((at=lower.indexOf(word,from))!==-1){spans.push([at,at+word.length]);from=at+word.length}}spans.sort((a,b)=>a[0]-b[0]);let out='',pos=0;for(const [a,b] of spans){if(a<pos)continue;out+=esc(raw.slice(pos,a))+'<mark>'+esc(raw.slice(a,b))+'</mark>';pos=b}return out+esc(raw.slice(pos))}
function drawTabs(){tabs.innerHTML=['Код района','Код ФНО','МССК / IFC'].map((name,i)=>'<button type="button" class="'+(section===i?'active':'')+'" data-section="'+i+'">'+name+'</button>').join('');subtabs.innerHTML=section===2?['Все листы',...DATA.slice(2).map(s=>s.name)].map((name,i)=>'<button type="button" class="'+(sheet===i-1?'active':'')+'" data-sheet="'+(i-1)+'">'+esc(name)+'</button>').join(''):'';q.placeholder=section===0?'Поиск по коду или названию района…':section===1?'Поиск по коду или названию ФНО…':'Введите код, название, IFC-класс…'}
function render(){const words=norm(q.value.trim()).split(/\s+/).filter(Boolean);let found=[];DATA.forEach((s,si)=>{if(section===0&&si!==0||section===1&&si!==1||section===2&&(si<2||sheet!==-1&&si!==sheet+2))return;s.rows.forEach((r,ri)=>{if(words.every(w=>r.some(v=>norm(v).includes(w))))found.push({s,r,si,ri,score:words.reduce((n,w)=>n+(norm(r[0]).includes(w)?5:0),0)})})});if(words.length)found.sort((a,b)=>b.score-a.score||a.si-b.si||a.ri-b.ri);count.textContent='Найдено записей: '+found.length.toLocaleString('ru');hint.textContent='Показано: '+Math.min(found.length,limit);results.innerHTML=found.slice(0,limit).map(({s,r})=>{const widths=['minmax(105px,0.75fr)',...Array(Math.max(0,s.headers.length-1)).fill('minmax(0,1fr)')];return '<article class="result"><div class="sheet">'+esc(s.name)+'</div><div class="fields" style="grid-template-columns:'+widths.join(' ')+'">'+s.headers.map((header,i)=>{const v=String(r[i]??'');return '<div class="field '+(i===0?'code-field ':'')+(!v?'blank':'')+'"><div class="label">'+esc(header)+'</div><div class="value">'+(v?highlight(v,words):'&nbsp;')+'</div>'+(v?'<button type="button" class="copy-cell" title="Копировать" aria-label="Копировать '+esc(header)+'" data-copy="'+esc(v)+'">⧉</button>':'')+'</div>'}).join('')+'</div></article>'}).join('')||'<div class="empty">Ничего не найдено. Попробуйте другой код или название.</div>';more.hidden=found.length<=limit}
async function copyValue(value){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(value);return true}catch(e){}}const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();return ok}
results.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const ok=await copyValue(b.dataset.copy);if(!ok){window.prompt('Скопируйте значение:',b.dataset.copy);return}b.textContent='✓';setTimeout(()=>{if(b.isConnected)b.textContent='⧉'},1100)});
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-section]');if(!b)return;section=Number(b.dataset.section);sheet=-1;limit=50;q.value='';drawTabs();render()});subtabs.addEventListener('click',e=>{const b=e.target.closest('[data-sheet]');if(!b)return;sheet=Number(b.dataset.sheet);limit=50;drawTabs();render()});q.addEventListener('input',()=>{limit=50;render()});more.addEventListener('click',()=>{limit+=50;render()});document.getElementById('clear').addEventListener('click',()=>{q.value='';limit=50;render();q.focus()});
const themeBtn=document.getElementById('theme');function setTheme(v){document.documentElement.dataset.theme=v;themeBtn.textContent=v==='dark'?'☀ Светлая тема':'☾ Тёмная тема';try{localStorage.setItem('classifier-theme',v)}catch(e){}}let saved='dark';try{saved=localStorage.getItem('classifier-theme')||'dark'}catch(e){}setTheme(saved==='light'?'light':'dark');themeBtn.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));drawTabs();render();
</script></body></html>
